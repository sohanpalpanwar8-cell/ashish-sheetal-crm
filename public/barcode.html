<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ashish Sheetal CRM - Official QR Barcode Poster</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090e1a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .poster-img { width: 100%; height: auto; border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); display: block; margin-bottom: 20px; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 16px; transition: 0.2s; border: none; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; box-shadow: 0 4px 15px rgba(37,99,235,0.4); }
    .btn-download { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 15px rgba(16,185,129,0.4); }
    .btn:active { transform: scale(0.98); }
    .tip { font-size: 13px; color: #94a3b8; margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <img src="/ashish_sheetal_crm_poster.png" alt="Ashish Sheetal All-In-One CRM Barcode Poster" class="poster-img">

    <div class="btn-group">
      <a href="/ashish_sheetal_crm_poster.png" download="Ashish_Sheetal_CRM_Barcode_Poster.png" class="btn btn-download">
        📥 यह फोटो फोन में डाउनलोड करें (Download)
      </a>
      <a href="https://ashish-sheetal-crm.vercel.app" class="btn btn-primary">
        🚀 सीधे वेबसाइट खोलें (Open App)
      </a>
    </div>

    <p class="tip">
      💡 <strong>टिप:</strong> इस फोटो को डाउनलोड करके प्रिंट करवा लें या दुकान/ऑफिस में लगा दें। कोई भी ग्राहक या आप इसे मोबाइल से स्कैन करके सीधे ऐप चला सकते हैं।
    </p>
  </div>
</body>
</html>
